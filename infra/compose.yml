services:

  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:latest
    ports:
      - "18789:18789"
      - "18790:18790"
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      OPENCLAW_CONFIG_DIR: /config
      OPENCLAW_WORKSPACE_DIR: /workspace
    command: ["openclaw", "gateway", "run", "--bind", "lan"]
    volumes:
      - openclaw-config:/config
      - openclaw-workspace:/workspace
      - openclaw-home:/home/node/.openclaw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  openclaw-cli:
    image: ghcr.io/openclaw/openclaw:latest
    network_mode: service:openclaw-gateway
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      OPENCLAW_CONFIG_DIR: /config
      OPENCLAW_WORKSPACE_DIR: /workspace
    volumes:
      - openclaw-config:/config
      - openclaw-workspace:/workspace
      - openclaw-home:/home/node/.openclaw
    depends_on:
      openclaw-gateway:
        condition: service_healthy
    restart: unless-stopped

  webhook-receiver:
    build: ../services/webhook-receiver
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  openclaw-config:
  openclaw-workspace:
  openclaw-home: